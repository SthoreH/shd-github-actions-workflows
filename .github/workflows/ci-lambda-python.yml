# Reusable workflow for Python Lambda CI
name: Lambda Python CI

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

# Least-privilege baseline; jobs override when they need more (e.g. id-token: write for OIDC).
permissions:
  contents: read

jobs:
  # Validates the Lambda application code: lint (non-blocking) and tests.
  python-quality:
    name: Validate Application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: SthoreH/shd-github-actions-workflows/actions/parse-config@main
        id: config-parser
        with:
          environment: ${{ inputs.environment }}

      # Flatten the merged config (JSON) into env vars so later steps don't repeat fromJSON expressions.
      - name: Export Config
        run: |
          echo "PY_VERSION=${{ fromJSON(steps.config-parser.outputs.config).pipe_runtime_python-version }}" >> $GITHUB_ENV
          echo "APP_PATH=${{ fromJSON(steps.config-parser.outputs.config).pipe_deploy_working-path }}" >> $GITHUB_ENV
          echo "APP_REQS=${{ fromJSON(steps.config-parser.outputs.config).pipe_deploy_requirements }}" >> $GITHUB_ENV
          echo "TESTS_PATH=${{ fromJSON(steps.config-parser.outputs.config).pipe_tests_working-path }}" >> $GITHUB_ENV
          echo "TESTS_REQS=${{ fromJSON(steps.config-parser.outputs.config).pipe_tests_requirements }}" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            ${{ env.APP_PATH }}/${{ env.APP_REQS }}
            ${{ env.TESTS_PATH }}/${{ env.TESTS_REQS }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ env.APP_PATH }}/${{ env.APP_REQS }}
          pip install -r ${{ env.TESTS_PATH }}/${{ env.TESTS_REQS }}

      # Non-blocking quality gate: lint findings are reported but don't fail the job.
      - name: Lint (non-blocking)
        continue-on-error: true
        working-directory: ${{ env.APP_PATH }}
        run: flake8 .

      - name: Test
        working-directory: ${{ env.TESTS_PATH }}
        run: pytest

  # Validates the Terraform infrastructure end-to-end (fmt + init + validate + plan).
  terraform-quality:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Binds the job to the caller's GitHub Environment to expose vars.AWS_ROLE_ARN and vars.TF_STATE_BUCKET.
    environment: ${{ inputs.environment }}
    # id-token: write is required by aws-actions/configure-aws-credentials (OIDC) inside validate-terraform.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: SthoreH/shd-github-actions-workflows/actions/parse-config@v1.2.0
        id: config-parser
        with:
          environment: ${{ inputs.environment }}

      - name: Export Config
        run: |
          echo "TF_VERSION=${{ fromJSON(steps.config-parser.outputs.config).pipe_infra_terraform-version }}" >> $GITHUB_ENV
          echo "TF_PATH=${{ fromJSON(steps.config-parser.outputs.config).pipe_infra_working-path }}" >> $GITHUB_ENV

      - name: Validate Terraform
        uses: SthoreH/shd-github-actions-workflows/actions/validate-terraform@v1.3.0
        with:
          environment: ${{ inputs.environment }}
          working-directory: ${{ env.TF_PATH }}
          terraform-version: ${{ env.TF_VERSION }}
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          tf-backend-bucket: ${{ vars.TF_STATE_BUCKET }}
          tf-backend-key: ${{ github.event.repository.name }}/terraform.tfstate

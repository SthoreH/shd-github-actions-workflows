# Reusable workflow for Python Lambda CD: token replacement -> package -> terraform apply.
name: Lambda Python CD

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      ref:
        description: Git ref (tag, branch, or SHA) to deploy. Empty means the workflow's default ref. Used by rollback.
        type: string
        required: false
        default: ''
    # AWS_ROLE_ARN and TF_STATE_BUCKET are GitHub Environment secrets. Declaring them here is
    # what makes the runtime inject the environment's secret values into this workflow's
    # `secrets` context (the job-level `environment:` below selects WHICH environment).
    # required:false is essential: required:true triggers caller-side validation that
    # `secrets: inherit` cannot satisfy for environment secrets ("required, but not provided
    # while calling"). The caller must use `secrets: inherit`.
    secrets:
      AWS_ROLE_ARN:
        description: AWS IAM role ARN to assume via OIDC.
        required: false
      TF_STATE_BUCKET:
        description: S3 bucket for Terraform state backend.
        required: false

permissions:
  contents: read
  id-token: write   # OIDC for AWS

jobs:
  # Single job: package and deploy share the runner so the .zip stays local — no artifact handoff needed.
  deploy:
    name: Package & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Binds the job to the caller's GitHub Environment to trigger protection rules (required reviewers, wait timers).
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: SthoreH/shd-github-actions-workflows/actions/parse-config@main
        id: config-parser
        with:
          environment: ${{ inputs.environment }}

      # Flatten the merged config (JSON) into env vars so later steps don't repeat fromJSON expressions.
      # Bracket notation is required: GitHub Actions dot-access doesn't work for keys containing hyphens.
      - name: Export Config
        run: |
          echo "PY_VERSION=${{ fromJSON(steps.config-parser.outputs.config)['pipe_runtime_python-version'] }}" >> $GITHUB_ENV
          echo "APP_PATH=${{ fromJSON(steps.config-parser.outputs.config)['pipe_deploy_working-path'] }}" >> $GITHUB_ENV
          echo "APP_REQS=${{ fromJSON(steps.config-parser.outputs.config)['pipe_deploy_requirements'] }}" >> $GITHUB_ENV
          echo "TF_PATH=${{ fromJSON(steps.config-parser.outputs.config)['pipe_infra_working-path'] }}" >> $GITHUB_ENV
          echo "TF_VERSION=${{ fromJSON(steps.config-parser.outputs.config)['pipe_infra_terraform-version'] }}" >> $GITHUB_ENV
          echo "ARCHITECTURE=${{ fromJSON(steps.config-parser.outputs.config)['pipe_runtime_architecture'] }}" >> $GITHUB_ENV

      # Substitute env-specific tokens into source files before packaging.
      - name: Replace Tokens
        uses: SthoreH/shd-github-actions-workflows/actions/replace-tokens@main
        with:
          files: ${{ steps.config-parser.outputs.files_to_replace }}
          vars: ${{ steps.config-parser.outputs.config }}

      # Builds the .zip at <repo-root>/dist/lambda.zip — the path the terraform locals expect.
      - name: Package Lambda
        uses: SthoreH/shd-github-actions-workflows/actions/package-lambda-python@main
        with:
          python-version: ${{ env.PY_VERSION }}
          working-directory: ${{ env.APP_PATH }}
          requirements: ${{ env.APP_REQS }}
          architecture: ${{ env.ARCHITECTURE }}

      - name: Deploy Terraform
        uses: SthoreH/shd-github-actions-workflows/actions/deploy-terraform@main
        with:
          environment: ${{ inputs.environment }}
          working-directory: ${{ env.TF_PATH }}
          terraform-version: ${{ env.TF_VERSION }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          tf-backend-bucket: ${{ secrets.TF_STATE_BUCKET }}
          tf-backend-key: ${{ github.event.repository.name }}/terraform.tfstate

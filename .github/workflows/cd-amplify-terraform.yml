# Reusable workflow for Amplify repos.
# Differences from cd-infra-terraform.yml:
# 1. `github-token` secret is forwarded as TF_VAR_github_token at job level.
# 2. After terraform apply, triggers an Amplify build explicitly.
#    Amplify's enable_auto_build is set to false in Terraform so the build
#    never starts in parallel with the apply.
name: Amplify Terraform CD

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      ref:
        description: Git ref (tag, branch, or SHA) to deploy. Empty means the workflow's default ref. Used by rollback.
        type: string
        required: false
        default: ''
    secrets:
      github-token:
        description: GitHub PAT used by Amplify to access the repository (forwarded as TF_VAR_github_token).
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy Amplify Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    # Job-level env is inherited by all steps including composite actions (deploy-terraform, validate-terraform).
    env:
      TF_VAR_github_token: ${{ secrets.github-token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: SthoreH/shd-github-actions-workflows/actions/parse-config@main
        id: config-parser
        with:
          environment: ${{ inputs.environment }}

      - name: Export Config
        run: |
          echo "TF_PATH=${{ fromJSON(steps.config-parser.outputs.config)['pipe_infra_working-path'] }}" >> $GITHUB_ENV
          echo "TF_VERSION=${{ fromJSON(steps.config-parser.outputs.config)['pipe_infra_terraform-version'] }}" >> $GITHUB_ENV

      - name: Replace Tokens
        uses: SthoreH/shd-github-actions-workflows/actions/replace-tokens@main
        with:
          files: ${{ steps.config-parser.outputs.files_to_replace }}
          vars: ${{ steps.config-parser.outputs.config }}

      - name: Deploy Terraform
        uses: SthoreH/shd-github-actions-workflows/actions/deploy-terraform@main
        with:
          environment: ${{ inputs.environment }}
          working-directory: ${{ env.TF_PATH }}
          terraform-version: ${{ env.TF_VERSION }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          tf-backend-bucket: ${{ secrets.TF_STATE_BUCKET }}
          tf-backend-key: ${{ github.event.repository.name }}/terraform.tfstate

      # Reads the Amplify app_id from terraform output to trigger the build.
      # AWS credentials are already active in the job env (set by configure-aws-credentials inside deploy-terraform).
      - name: Get Amplify App ID
        working-directory: ${{ env.TF_PATH }}
        run: echo "AMPLIFY_APP_ID=$(terraform output -raw app_id)" >> $GITHUB_ENV

      - name: Trigger Amplify Build
        run: |
          BRANCH=$([[ "${{ inputs.environment }}" == "prod" ]] && echo "main" || echo "dev")
          aws amplify start-job \
            --app-id "${{ env.AMPLIFY_APP_ID }}" \
            --branch-name "$BRANCH" \
            --job-type RELEASE \
            --region sa-east-1

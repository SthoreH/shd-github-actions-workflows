name: Package Python Lambda
description: Builds a Lambda-compatible .zip with runtime dependencies installed alongside the source code.

inputs:
  python-version:
    description: Python version used to install dependencies
    required: true
  working-directory:
    description: Source root containing application code and the requirements file (e.g., app/src)
    required: true
  requirements:
    description: Requirements file name relative to working-directory
    required: true
  output-path:
    description: Absolute path where the resulting .zip will be written
    required: false
    default: ${{ github.workspace }}/dist/lambda.zip
  architecture:
    description: >-
      Target Lambda architecture (x86_64 or arm64). Runners are x86_64, so an
      arm64 Lambda needs pip to fetch wheels for the target platform instead of
      the host's — otherwise native dependencies are packaged for the wrong
      architecture and fail at import time. When left empty (the default),
      falls back to `.runtime.architecture` in the repo root's
      `.pipeline.yml`, then to `x86_64` if that's absent too — see
      docs/actions/package-lambda-python.md for the full resolution order.
    required: false
    default: ""

outputs:
  zip-path:
    description: Absolute path to the produced .zip
    value: ${{ steps.build.outputs.zip-path }}

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.requirements }}

    # Lambda layout: deps installed into the package root, source copied on top preserving directory structure, then zipped.
    - name: Build package
      id: build
      shell: bash
      env:
        WORKING_DIR: ${{ inputs.working-directory }}
        REQUIREMENTS: ${{ inputs.requirements }}
        OUTPUT_PATH: ${{ inputs.output-path }}
        INPUT_ARCHITECTURE: ${{ inputs.architecture }}
        PY_VERSION: ${{ inputs.python-version }}
        PIPELINE_FILE: ${{ github.workspace }}/.pipeline.yml
      run: |
        set -euo pipefail
        BUILD_DIR=$(mktemp -d)

        # Resolution order: explicit input > .pipeline.yml's runtime.architecture > x86_64.
        # The fallback exists so consumers pinned to an older tag of this repo (before the
        # `architecture` input existed) still get correct wheels for a Lambda declared arm64
        # in their own .pipeline.yml, with no pin bump required.
        if [ -n "$INPUT_ARCHITECTURE" ]; then
          ARCHITECTURE="$INPUT_ARCHITECTURE"
          ARCH_SOURCE="input"
        elif [ -f "$PIPELINE_FILE" ]; then
          FILE_ARCHITECTURE=$(yq -r '.runtime.architecture // ""' "$PIPELINE_FILE" 2>/dev/null || echo "")
          if [ -n "$FILE_ARCHITECTURE" ] && [ "$FILE_ARCHITECTURE" != "null" ]; then
            ARCHITECTURE="$FILE_ARCHITECTURE"
            ARCH_SOURCE=".pipeline.yml"
          else
            ARCHITECTURE="x86_64"
            ARCH_SOURCE="default (no runtime.architecture in .pipeline.yml)"
          fi
        else
          ARCHITECTURE="x86_64"
          ARCH_SOURCE="default (no .pipeline.yml)"
        fi
        echo "Resolved architecture: $ARCHITECTURE (source: $ARCH_SOURCE)"

        # Cross-platform install for arm64: --platform requires --only-binary,
        # so every dependency must ship a wheel (all of them do today).
        if [ "$ARCHITECTURE" = "arm64" ]; then
          pip install -r "$WORKING_DIR/$REQUIREMENTS" -t "$BUILD_DIR" \
            --platform manylinux2014_aarch64 \
            --python-version "$PY_VERSION" \
            --only-binary=:all:
        else
          pip install -r "$WORKING_DIR/$REQUIREMENTS" -t "$BUILD_DIR"
        fi
        rsync -a --exclude="$REQUIREMENTS" "$WORKING_DIR/" "$BUILD_DIR/"
        mkdir -p "$(dirname "$OUTPUT_PATH")"
        (cd "$BUILD_DIR" && zip -qr "$OUTPUT_PATH" .)
        echo "zip-path=$OUTPUT_PATH" >> "$GITHUB_OUTPUT"

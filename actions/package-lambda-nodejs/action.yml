name: Package Node.js Lambda
description: Builds a Lambda-compatible .zip via esbuild bundle (single-file). Supports TypeScript and JavaScript.

inputs:
  nodejs-version:
    description: Node.js major version used by setup-node (e.g. "22")
    required: true
  working-directory:
    description: Source root containing package.json and pnpm-lock.yaml (e.g. app)
    required: true
  entry-file:
    description: Entry file for esbuild, relative to working-directory (e.g. src/index.ts)
    required: true
  output-path:
    description: Absolute path where the resulting .zip will be written
    required: false
    default: ${{ github.workspace }}/dist/lambda.zip
  pnpm-version:
    description: pnpm major version
    required: false
    default: '9'

outputs:
  zip-path:
    description: Absolute path to the produced .zip
    value: ${{ steps.build.outputs.zip-path }}

runs:
  using: composite
  steps:
    # pnpm must be installed BEFORE setup-node so cache: 'pnpm' resolves correctly.
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.nodejs-version }}
        cache: 'pnpm'
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    # esbuild bundle: single file, AWS SDK v3 is provided by the nodejs runtime so it's externalized.
    - name: Build package
      id: build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENTRY_FILE: ${{ inputs.entry-file }}
        NODEJS_VERSION: ${{ inputs.nodejs-version }}
        OUTPUT_PATH: ${{ inputs.output-path }}
      run: |
        set -euo pipefail
        pnpm install --frozen-lockfile
        BUILD_DIR=$(mktemp -d)
        pnpm exec esbuild "$ENTRY_FILE" \
          --bundle \
          --platform=node \
          --target=node${NODEJS_VERSION} \
          --outfile="$BUILD_DIR/index.js" \
          --external:@aws-sdk/* \
          --minify
        mkdir -p "$(dirname "$OUTPUT_PATH")"
        (cd "$BUILD_DIR" && zip -qr "$OUTPUT_PATH" .)
        echo "zip-path=$OUTPUT_PATH" >> "$GITHUB_OUTPUT"

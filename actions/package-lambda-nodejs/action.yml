name: Package Node.js Lambda
description: Builds a Lambda-compatible .zip with the full working-directory structure and production dependencies.

inputs:
  nodejs-version:
    description: Node.js major version used by setup-node (e.g. "22")
    required: true
  working-directory:
    description: Source root containing package.json and pnpm-lock.yaml (e.g. app)
    required: true
  output-path:
    description: Absolute path where the resulting .zip will be written
    required: false
    default: ${{ github.workspace }}/dist/lambda.zip
  pnpm-version:
    description: pnpm major version
    required: false
    default: '9'

outputs:
  zip-path:
    description: Absolute path to the produced .zip
    value: ${{ steps.build.outputs.zip-path }}

runs:
  using: composite
  steps:
    # pnpm must be installed BEFORE setup-node so cache: 'pnpm' resolves correctly.
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.nodejs-version }}
        cache: 'pnpm'
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - name: Build package
      id: build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        OUTPUT_PATH: ${{ inputs.output-path }}
      run: |
        set -euo pipefail
        # Populate the pnpm store so the prod-only install below is fast/cached.
        pnpm install --frozen-lockfile
        BUILD_DIR=$(mktemp -d)
        # Copy source preserving directory structure, excluding node_modules.
        rsync -a --exclude='node_modules' . "$BUILD_DIR/"
        # Install production deps with a flat layout that Lambda's require() can resolve.
        (cd "$BUILD_DIR" && pnpm install --prod --frozen-lockfile --shamefully-hoist)
        mkdir -p "$(dirname "$OUTPUT_PATH")"
        (cd "$BUILD_DIR" && zip -qr "$OUTPUT_PATH" .)
        echo "zip-path=$OUTPUT_PATH" >> "$GITHUB_OUTPUT"

# shared-actions/composite/config-parser/action.yml
name: "Parse Config"
description: "Reads and merges pipeline config file"
inputs:
  environment:
    description: "Target environment"
    required: true
  config_file:
    description: "Path to config file"
    default: ".pipeline.yml"

outputs:
  config:
    description: "JSON string of merged variables"
    value: ${{ steps.parser.outputs.vars }}
  files_to_replace:
    description: "List of files for token replacement"
    value: ${{ steps.parser.outputs.files }}

runs:
  using: "composite"
  steps:
    - name: Config Parse
      id: parser
      shell: bash
      run: |
        # 1. Merge global lambda_settings with the specific environment
        VARS=$(yq -o=json -I=0 '
          [
            {
              "runtime":     .runtime,
              "environment": .environments["${{ inputs.environment }}"],
              "tests":       .tests,
              "deploy":      .deploy
            }
            | .. | select(tag != "!!map" and tag != "!!seq")
            | {"key": ("pipe_" + (path | join("_"))), "value": .}
          ]
          | from_entries
        ' ${{ inputs.config_file }})

        # 2. Extract the substitution files list
        FILES=$(yq -r '.environments["files-to-replace"] | join(" ")' ${{ inputs.config_file }})

        # 3. Set outputs
        echo "vars=$VARS" >> $GITHUB_OUTPUT
        echo "files=$FILES" >> $GITHUB_OUTPUT

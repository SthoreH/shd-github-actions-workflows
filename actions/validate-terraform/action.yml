name: Terraform Validate & Plan
description: Runs terraform fmt, init, validate and plan against a given environment

inputs:
  environment:
    description: Deployment environment (e.g., dev, prod)
    required: true
  working-directory:
    description: Path to the Terraform root module (relative to repo root)
    required: false
    default: terraform-aws
  tf-backend-bucket:
    description: S3 bucket for Terraform state backend
    required: true
  tf-backend-key:
    description: Key for Terraform state in S3
    required: true
  aws-role-arn:
    description: AWS IAM role ARN to assume
    required: true
  aws-region:
    description: AWS region
    required: false
    default: sa-east-1
  terraform-version:
    description: Terraform version to use
    required: false
    default: '1.14.8'

runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}

    # Assumes role via OIDC. Caller job must set permissions: id-token: write.
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Terraform Format Check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform fmt -check -recursive

    # Backend config injected here so the action stays environment-agnostic.
    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        terraform init \
          -input=false \
          -lock-timeout=5m \
          -backend-config="bucket=${{ inputs.tf-backend-bucket }}" \
          -backend-config="key=${{ inputs.tf-backend-key }}"

    - name: Terraform Validate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform validate -no-color

    # Org convention: per-env tfvars at environments/<env>.tfvars.
    - name: Terraform Plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        terraform plan \
          -input=false \
          -lock-timeout=5m \
          -no-color \
          -var-file=environments/${{ inputs.environment }}.tfvars
